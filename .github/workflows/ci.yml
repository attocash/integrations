name: CLI and MCP

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:integration
        if: runner.os == 'Linux'
      - name: Verify both artifacts in clean CLI-only, paired, and global installations
        run: npm run test:package
        env:
          ATTO_TEST_PACKAGE_INTEGRATION: ${{ runner.os == 'Linux' && '1' || '0' }}

  password-store:
    env:
      ATTO_TEST_KEYCHAIN: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Linux Secret Service tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools gnome-keyring dbus-x11
      - name: Verify Linux credential persistence in an isolated session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -eu -c '
            printf "\n" | gnome-keyring-daemon --unlock --components=secrets
            npm run test:keychain
          '
      - name: Verify native credential persistence
        if: runner.os != 'Linux'
        run: npm run test:keychain

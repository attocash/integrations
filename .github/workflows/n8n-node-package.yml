name: n8n Atto Node

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/n8n-node-package.yml"
      - "n8n-node/**"
  pull_request:
    paths:
      - ".github/workflows/n8n-node-package.yml"
      - "n8n-node/**"

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_release: ${{ steps.metadata.outputs.has_release }}
      package_version: ${{ steps.metadata.outputs.package_version }}
      release_version: ${{ steps.metadata.outputs.release_version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - id: semantic
        name: Semantic Release Dry Run
        if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') }}
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24.2.7
          working_directory: n8n-node
          dry_run: true
          ci: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}
          unset_gha_env: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute package version
        id: metadata
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME_FULL: ${{ github.ref }}
          NEW_RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
          LAST_RELEASE_VERSION: ${{ steps.semantic.outputs.last_release_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          base_version="${NEW_RELEASE_VERSION:-${LAST_RELEASE_VERSION:-0.0.0}}"
          short_sha="${SHA:0:12}"
          has_release=false
          release_version="$base_version"
          release_tag=""

          if [ -n "$NEW_RELEASE_VERSION" ]; then
            package_version="$NEW_RELEASE_VERSION"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            package_version="${base_version}-pr.${PR_NUMBER}.sha${short_sha}"
          else
            package_version="${base_version}-snapshot.sha${short_sha}"
          fi

          if [ "$EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME_FULL" = "refs/heads/main" ] && [ -n "$NEW_RELEASE_VERSION" ]; then
            has_release=true
            release_version="$NEW_RELEASE_VERSION"
            release_tag="n8n-node-v$NEW_RELEASE_VERSION"
          fi

          echo "has_release=$has_release" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  test-and-pack:
    name: Test and pack
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
    defaults:
      run:
        working-directory: n8n-node

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: npm
          cache-dependency-path: n8n-node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply computed package version
        run: npm version "${{ needs.version.outputs.package_version }}" --no-git-tag-version --allow-same-version

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Pack package
        run: |
          mkdir -p ../artifacts
          npm pack --pack-destination ../artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: attocash-n8n-nodes-atto-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs:
      - version
      - test-and-pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.version.outputs.has_release == 'true'
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: n8n-node-release-${{ needs.version.outputs.release_version }}
      cancel-in-progress: true
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    defaults:
      run:
        working-directory: n8n-node

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: attocash-n8n-nodes-atto-package
          path: n8n-node/artifacts

      - name: Create GitHub release
        uses: cycjimmy/semantic-release-action@v6
        with:
          semantic_version: 24.2.7
          working_directory: n8n-node
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: npm publish artifacts/*.tgz --provenance --access public

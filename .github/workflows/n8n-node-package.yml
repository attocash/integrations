name: n8n Atto Node

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "n8n-node-v*.*.*"
    paths:
      - ".github/workflows/n8n-node-package.yml"
      - "n8n-node/**"
  pull_request:
    paths:
      - ".github/workflows/n8n-node-package.yml"
      - "n8n-node/**"

permissions:
  contents: read

jobs:
  test-and-pack:
    name: Test, pack, and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: n8n-node

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: npm
          cache-dependency-path: n8n-node/package-lock.json

      - name: Install Trusted Publishing-capable npm
        run: npm install --global npm@^11.5.1

      - name: Verify Trusted Publishing npm support
        run: |
          node -e 'const version = process.versions.node; const [major, minor] = version.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) throw new Error("Trusted Publishing requires Node >=22.14.0, got " + version);'
          npm_version="$(npm --version)"
          node -e 'const version = process.argv[1]; const [major, minor, patch] = version.split(".").map(Number); if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) throw new Error("Trusted Publishing requires npm >=11.5.1, got " + version);' "$npm_version"

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/n8n-node-v')
        run: npm run validate:release-tag

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Pack package
        run: |
          mkdir -p ../artifacts
          npm pack --pack-destination ../artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: attocash-n8n-nodes-atto-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 14

      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/n8n-node-v')
        run: |
          if [ -n "${NPM_TOKEN:-}" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi
          npm publish ../artifacts/*.tgz --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
